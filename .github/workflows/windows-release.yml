name: Build Windows executable

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:exe
      - shell: pwsh
        run: |
          $exe = Get-ChildItem dist/ROBLOX-UBERS-v*.exe | Sort-Object Name -Descending | Select-Object -First 1
          Copy-Item $exe.FullName dist/ROBLOX-UBERS.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ROBLOX-UBERS-Windows
          path: dist/ROBLOX-UBERS.exe
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:GITHUB_REF_NAME" || gh release create "$env:GITHUB_REF_NAME" --generate-notes
          gh release upload "$env:GITHUB_REF_NAME" "dist/ROBLOX-UBERS.exe" --clobber
